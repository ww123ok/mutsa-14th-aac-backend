server:
  port: 8080
  forward-headers-strategy: framework

spring:
  profiles:
    include: secret

  application:
    name: hackathon

  datasource:
    url: jdbc:h2:mem:aacdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  oauth2:
    success-redirect-uri: ${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:3000/oauth2/callback/kakao}
    failure-redirect-uri: ${FRONTEND_OAUTH_FAILURE_URL:http://localhost:3000/?error=oauth2_login_failed}

  jwt:
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
