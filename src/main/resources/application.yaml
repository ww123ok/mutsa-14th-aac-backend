server:
  port: 8080
  forward-headers-strategy: framework

spring:
  profiles:
    include: secret

  application:
    name: hackathon

  datasource:
    url: jdbc:h2:mem:aacdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  oauth2:
    success-redirect-uri: ${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:3000/oauth2/callback/kakao}
    failure-redirect-uri: ${FRONTEND_OAUTH_FAILURE_URL:http://localhost:3000/?error=oauth2_login_failed}

  jwt:
    access-token-expiration: 1800000
    refresh-token-expiration: 1209600000
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  # 일간 보상, 성찰 질문, AI 기억에서 사용하는 공통 OpenAI 설정
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

    reflection-enabled: ${OPENAI_REFLECTION_ENABLED:false}
    reward-enabled: ${OPENAI_REWARD_ENABLED:false}

    # 일기에서 향후 작성 도움 질문용
    # 개인화 기억 후보를 추출하는 기능
    memory-extraction-enabled: ${OPENAI_MEMORY_EXTRACTION_ENABLED:false}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

  experience-sharing:
    minimum-similarity: ${EXPERIENCE_MATCH_MINIMUM_SIMILARITY:0.78}
    auto-approval-enabled: ${EXPERIENCE_AUTO_APPROVAL_ENABLED:true}
    auto-approval-days: ${EXPERIENCE_AUTO_APPROVAL_DAYS:5}
    auto-approval-cron: "${EXPERIENCE_AUTO_APPROVAL_CRON:0 0 * * * *}"

  dev:
    # 기본적으로 비활성화
    # 개발 서버에서만 DEV_RESET_ENABLED=true로 활성화
    reset-enabled: ${DEV_RESET_ENABLED:false}
    dated-diary-enabled: ${DEV_DATED_DIARY_ENABLED:false}
      # 양수: 비밀번호 + 특정 ID 모두 검사
      # 0 이하: 비밀번호를 통과한 모든 로그인 사용자 허용
    dated-diary-allowed-user-id: ${DEV_DATED_DIARY_ALLOWED_USER_ID:-1}

    dated-diary-max-past-days: ${DEV_DATED_DIARY_MAX_PAST_DAYS:3650}

      # 실제 비밀번호가 아닌 SHA-256 해시만 저장
    test-password-sha256: ${DEV_TEST_PASSWORD_SHA256:}

  weekly-reward:
    enabled: ${WEEKLY_REWARD_ENABLED:false}
    # 로컬·스테이징에서 실제 작성 일기의 수동 생성 확인에만 사용
    # 운영 환경에서는 반드시 false
    manual-trigger-enabled: ${WEEKLY_REWARD_MANUAL_TRIGGER_ENABLED:false}

    minimum-diary-count: ${WEEKLY_REWARD_MINIMUM_DIARY_COUNT:3}
    daily-reward-wait-minutes: ${WEEKLY_REWARD_DAILY_REWARD_WAIT_MINUTES:10}
    max-attempts: ${WEEKLY_REWARD_MAX_ATTEMPTS:3}
    stale-minutes: ${WEEKLY_REWARD_STALE_MINUTES:30}
    image-url-expiration-minutes: ${WEEKLY_REWARD_IMAGE_URL_EXPIRATION_MINUTES:15}

    # 사용자별 DAYBIT 시작 시간 경계를 확인하는 poll 주기.
    # 매분 확인하지만 실제 생성은 각 사용자의 월요일 시작 시간 + 5분에만 수행.
    boundary-cron: "${WEEKLY_REWARD_BOUNDARY_CRON:0 * * * * *}"

    # 사용자별 하루 시작 후 주간 보상 자동 생성을 지연할 시간
    schedule-delay-minutes: ${WEEKLY_REWARD_SCHEDULE_DELAY_MINUTES:5}

    # 일간 색 보상 지연·S3 장애·서버 중단 복구를 위해
    # 월·화요일 매시간 15분에 이미 생성 시각이 지난 사용자만 재검사
    retry-cron: "${WEEKLY_REWARD_RETRY_CRON:0 15 * * * MON,TUE}"

    s3:
      region: ${AWS_REGION:ap-northeast-2}
      bucket: ${WEEKLY_REWARD_S3_BUCKET:}

    # 주간 보상 전용 OpenAI 설정
    openai:
        text-model: ${OPENAI_WEEKLY_TEXT_MODEL:gpt-5.6-terra}
        image-model: ${OPENAI_IMAGE_MODEL:gpt-image-2}

        # 기존 정방형 설정과의 호환성을 유지
        image-size: ${OPENAI_IMAGE_SIZE:1024x1024}
        image-square-size: ${OPENAI_IMAGE_SQUARE_SIZE:${OPENAI_IMAGE_SIZE:1024x1024}}
        image-portrait-size: ${OPENAI_IMAGE_PORTRAIT_SIZE:1024x1536}
        image-landscape-size: ${OPENAI_IMAGE_LANDSCAPE_SIZE:1536x1024}

        image-quality: ${OPENAI_IMAGE_QUALITY:medium}
