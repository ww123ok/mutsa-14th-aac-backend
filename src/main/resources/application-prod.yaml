spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=${DB_SSL_MODE:REQUIRED}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1700000}

  h2:
    console:
      enabled: false

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

logging:
  level:
    org.hibernate.SQL: INFO

app:
  oauth2:
    # 운영 환경에서는 환경변수가 누락되어도 localhost로 되돌아가지 않도록
    # DAYBIT 운영 프론트를 안전한 기본 redirect 대상으로 사용
    success-redirect-uri: ${FRONTEND_OAUTH_SUCCESS_URL:https://www.daybit.cloud/oauth2/callback/kakao}
    failure-redirect-uri: ${FRONTEND_OAUTH_FAILURE_URL:https://www.daybit.cloud/?error=oauth2_login_failed}
