spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=${DB_SSL_MODE:REQUIRED}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1700000}

  h2:
    console:
      enabled: false

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}

    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

logging:
  level:
    org.hibernate.SQL: INFO