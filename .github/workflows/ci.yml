name: Backend CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      # CI 전용 dummy 값.
      # 실제 운영 Secret을 사용하지 않음.
      APP_JWT_SECRET: ci-only-dummy-jwt-secret-at-least-32-bytes-long-1234567890

      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_ID: ci-test-client-id
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KAKAO_CLIENT_SECRET: ci-test-client-secret

      OPENAI_REFLECTION_ENABLED: 'false'
      OPENAI_REWARD_ENABLED: 'false'
      OPENAI_MEMORY_EXTRACTION_ENABLED: 'false'

      DEV_RESET_ENABLED: 'false'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew clean build --no-daemon